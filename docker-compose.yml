services:
  postgres:
    image: postgres:16
    container_name: softwareverification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: softwareverification
      POSTGRES_USER: softwareverification
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softwareverification -d softwareverification"]
      interval: 5s
      timeout: 5s
      retries: 10