services:
  postgres:
    image: postgres:16
    container_name: softwareverification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: softwareverification
      POSTGRES_USER: softwareverification
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softwareverification -d softwareverification"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SoftwareVerification.Api/Dockerfile
    container_name: softwareverification-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=softwareverification;Username=softwareverification;Password=devpass"
    ports:
      - "8001:8080"
    restart: unless-stopped